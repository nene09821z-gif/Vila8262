name: Chess Bot Android APK — WORKFLOW V70.0

"on":
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Tên file ZIP nguồn ở thư mục gốc repo (để trống = tự chọn ZIP vila-chess*.zip mới nhất, bỏ qua *patch-only*)"
        required: false
        default: ""
      puzzle_pack_max:
        description: "Số câu đố tối đa đưa vào APK (từ cơ sở dữ liệu Lichess CC0). Để trống = 1000000"
        required: false
        default: ""
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: chess-bot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      INCLUDE_STOCKFISH_FULL: "1"

    steps:
      - name: VERIFY ACTIVE WORKFLOW — V70.0
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_REVISION=chess-android-v70-chesscom-pages-puzzle-pack-2026-10-27"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and safely extract Chess Bot source
        id: source
        shell: bash
        env:
          INPUT_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail

          ZIP_FILE=""
          if [[ -n "${INPUT_ZIP:-}" ]]; then
            ZIP_FILE="$GITHUB_WORKSPACE/$INPUT_ZIP"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              \( -name 'vila-chess*.zip' -o -name 'VILA*.zip' \) \
              ! -iname '*patch-only*' -printf '%p\n' | sort -V | tail -n 1)"
          fi

          if [[ -z "$ZIP_FILE" || ! -s "$ZIP_FILE" ]]; then
            if [[ -f package.json && -f capacitor.config.json ]]; then
              echo "No source ZIP found; using the repository root as the project."
              echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No full source ZIP (vila-chess*.zip, not *patch-only*) and no Capacitor project at the repo root."
            exit 1
          fi

          echo "Using source ZIP: $(basename "$ZIP_FILE")"
          export ZIP_FILE

          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          archive = pathlib.Path(os.environ["ZIP_FILE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chess-bot-source"
          out.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()

              if len(entries) > 12000:
                  raise SystemExit("ZIP rejected: too many entries")

              if sum(e.file_size for e in entries) > 700 * 1024 * 1024:
                  raise SystemExit("ZIP rejected: expanded size exceeds 700 MB")

              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {entry.filename}")

              zf.extractall(out)

          candidates = [
              p for p in out.rglob("package.json")
              if "node_modules" not in p.parts
              and (p.parent / "capacitor.config.json").is_file()
          ]

          if not candidates:
              raise SystemExit(
                  "No valid Capacitor project (package.json + capacitor.config.json) in "
                  + archive.name
                  + ". If this is a PATCH-ONLY ZIP, copy its files over the full project first."
              )

          candidates.sort(key=lambda p: (len(p.parts), str(p)))
          shallowest = len(candidates[0].parts)
          roots = [p for p in candidates if len(p.parts) == shallowest]

          if len(roots) != 1:
              raise SystemExit(
                  "Ambiguous project roots in source ZIP: "
                  + ", ".join(str(p.parent) for p in roots)
              )

          project = roots[0].parent

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"project_dir={project}\n")

          print(f"Using project: {project}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify JDK 21 (Capacitor 7 needs Java 21)
        shell: bash
        run: |
          set -euo pipefail
          javac -version
          major="$(javac -version 2>&1 | sed -E 's/^javac ([0-9]+).*/\1/')"
          if [ "$major" -lt 21 ]; then echo "::error::JDK $major found; Java 21+ required."; exit 1; fi
          rm -f "$HOME/.gradle/gradle.properties"

      # Không liệt kê "tools" (gói đã lỗi thời, sdkmanager báo "Failed to find package tools").
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download and verify native Stockfish Android ARM64
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: bash scripts/fetch-native-stockfish-android.sh

      - name: Install Node dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          REQUIRE_STOCKFISH: "1"
          REQUIRE_STOCKFISH_10: "1"
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          find src server scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -r -n1 node --check
          python3 -m py_compile scripts/package-android-source.py

      # Bắt lỗi lệch phiên bản, import Worker hỏng, CRLF và gói CSS cũ TRƯỚC khi mất công build APK.
      - name: Release sync check (versions, Worker imports, line endings, CSS bundle)
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: node scripts/check-sync.mjs

      - name: Require Stockfish 19 Full NNUE, Lite, ASM-JS and Stockfish 10 opponent assets
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -s public/engine/stockfish-19-single.js
          test -s public/engine/stockfish-19-single.wasm
          test -s public/engine/stockfish-19-lite-single.js
          test -s public/engine/stockfish-19-lite-single.wasm
          test -s public/engine/stockfish-19-asm.js
          test -s public/engine/stockfish-10.js
          test -s public/engine/STOCKFISH-10-LICENSE.txt
          node -e "const m=require('./public/engine/engine-manifest.json'); if(!m.full || !m.sf10 || m.sf10Version !== '10.0.2') process.exit(1)"
          echo 'Stockfish 19 Full NNUE, Lite, ASM-JS and Stockfish 10 opponent assets are present.'

      - name: Verify offline engine assets and release manifest
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: node scripts/verify-engine-assets.mjs --release --skip-smoke

      # Kiểm thử là cổng chất lượng bắt buộc: lỗi sẽ chặn việc đóng gói APK.
      - name: Run tests
        id: tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-report.tap

      - name: Show failed tests on the run summary page
        if: always() && steps.tests.outcome == 'failure'
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          {
            echo '### Tests failed (APK build halted)'
            echo 'Copy the block below and send it for fixing:'
            echo '```'
            grep -E '^[[:space:]]*not ok' test-report.tap | head -40 || true
            echo '```'
            echo 'Error details:'
            echo '```'
            grep -E "error:|Cannot find|ERR_|expected|actual|AssertionError" test-report.tap | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Tests failed::APK build halted. Open the run Summary page to see which tests failed.'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ${{ steps.source.outputs.project_dir }}/test-report.tap
          if-no-files-found: ignore

      # Kho tích hợp trong ZIP chỉ có ~1.700 câu. Bước này thay bằng cơ sở dữ liệu câu đố Lichess (CC0, ~5 triệu câu)
      # ngay trên máy chủ build (có internet). Bộ lọc nới lỏng để lấy được NHIỀU câu nhất; mỗi câu vẫn được app
      # kiểm tra lại từng nước bằng luật cờ trước khi hiển thị. Không bao giờ làm hỏng build: nếu tải/chuyển đổi lỗi
      # thì giữ nguyên kho nhỏ đi kèm và in cảnh báo.
      - name: Build full Lichess puzzle pack (up to 1,000,000 puzzles, sharded by rating)
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          PUZZLE_PACK_MAX_INPUT: ${{ inputs.puzzle_pack_max }}
          PUZZLE_PACK_MAX_VAR: ${{ vars.PUZZLE_PACK_MAX }}
        run: |
          set +e
          MAX="${PUZZLE_PACK_MAX_INPUT:-${PUZZLE_PACK_MAX_VAR:-1000000}}"
          case "$MAX" in ''|*[!0-9]*) MAX=1000000 ;; esac
          sudo apt-get install -y zstd >/dev/null 2>&1
          if curl -fL --retry 4 --retry-delay 5 --max-time 1500 -o /tmp/lichess_db_puzzle.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst; then
            node --max-old-space-size=6144 scripts/build-puzzle-pack.mjs /tmp/lichess_db_puzzle.csv.zst \
                --max "$MAX" --shard-size 1500 \
                --min-popularity 70 --min-plays 300 --max-deviation 110 --max-plies 12 \
                --out /tmp/puzzle-pack \
              && test -s /tmp/puzzle-pack/index.json \
              && rm -rf public/puzzles && cp -r /tmp/puzzle-pack public/puzzles \
              && echo "Full puzzle pack installed: $(node -e "console.log(JSON.parse(require('fs').readFileSync('public/puzzles/index.json','utf8')).total)") puzzles, $(du -sh public/puzzles | cut -f1)" \
              && echo "### Puzzle pack: $(node -e "console.log(JSON.parse(require('fs').readFileSync('public/puzzles/index.json','utf8')).total)") puzzles ($(du -sh public/puzzles | cut -f1))" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning title=Puzzle pack::Conversion failed; the bundled pack is kept."
          else
            echo "::warning title=Puzzle pack::Could not download the Lichess puzzle database; the bundled pack is kept."
          fi
          exit 0

      - name: Build web assets
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          REQUIRE_STOCKFISH: "1"
          REQUIRE_STOCKFISH_10: "1"
          REQUIRE_OPENING_CATALOG: "1"
          REQUIRE_PIECE_SETS: "1"
        run: npm run build

      - name: Verify complete ECO catalog was copied into the production build
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: node scripts/verify-opening-catalog.mjs

      - name: Generate, brand, and verify Android project
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          REQUIRE_STOCKFISH: "1"
        run: |
          set -euo pipefail

          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            npx cap add android
          fi
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

          npx cap sync android
          node scripts/install-native-stockfish-android.mjs android
          node scripts/apply-android-branding.mjs

          python3 - <<'PY'
          import re, pathlib, sys
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if not mf.is_file():
              sys.exit("AndroidManifest.xml not found: " + str(mf))
          xml = mf.read_text(encoding="utf-8")
          if "android.permission.CAMERA" not in xml:
              m = re.search(r"<manifest\b[^>]*>", xml)
              if not m:
                  sys.exit("Invalid AndroidManifest.xml: no <manifest> element")
              add = ('\n    <uses-permission android:name="android.permission.CAMERA" />'
                     '\n    <uses-feature android:name="android.hardware.camera" android:required="false" />')
              mf.write_text(xml[:m.end()] + add + xml[m.end():], encoding="utf-8")
              print("Added CAMERA permission to AndroidManifest.xml")
          else:
              print("CAMERA permission already present.")
          PY
          node scripts/ensure-camera-permission.mjs android
          node scripts/verify-android-project.mjs
          python3 scripts/package-android-source.py "$RUNNER_TEMP/covua-vila-android-gradle-source.zip"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace "-Dorg.gradle.java.home=$JAVA_HOME" assembleDebug

      - name: Verify APK integrity and package contents
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK missing or empty: $APK"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          unzip -t "$APK" >/dev/null

          python3 - "$APK" <<'PY'
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])

          if not zipfile.is_zipfile(apk):
              raise SystemExit("APK is not a valid ZIP-based Android package")

          with zipfile.ZipFile(apk) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK entry: {bad}")

              names = set(zf.namelist())

              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK is missing AndroidManifest.xml")

              dex_files = [
                  n for n in names
                  if n == "classes.dex"
                  or (n.startswith("classes") and n.endswith(".dex") and n[7:-4].isdigit())
              ]
              if not dex_files:
                  raise SystemExit("APK contains no DEX bytecode")

              if "lib/arm64-v8a/libstockfish.so" not in names:
                  raise SystemExit("APK is missing lib/arm64-v8a/libstockfish.so (native Stockfish)")

              if "assets/public/puzzles/index.json" not in names:
                  raise SystemExit("APK is missing the bundled puzzle pack (assets/public/puzzles/index.json)")
              shards = [n for n in names if n.startswith("assets/public/puzzles/band-") and n.endswith(".json")]

              print("APK ZIP integrity: PASS")
              print("Android manifest: PASS")
              print("DEX files:", ", ".join(sorted(dex_files)))
              print("Native Stockfish ARM64: PASS")
              print(f"Puzzle pack shards in APK: {len(shards)}")
          PY

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk"
          cmp "$APK" "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk"

          sha256sum "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk" \
            | tee "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-debug-apk
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Gradle source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: covua-vila-android-gradle-source
          path: ${{ runner.temp }}/covua-vila-android-gradle-source.zip
          if-no-files-found: ignore
          retention-days: 14
